<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zertifikats-Verifizierung | DEKRA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; max-width: 600px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; margin-bottom: 20px; font-size: 0.95rem; }
    .valid { background: #166534; color: #4ade80; border: 1px solid #22c55e; }
    .invalid { background: #991b1b; color: #f87171; border: 1px solid #ef4444; }
    .btn { display: inline-block; padding: 12px 20px; border-radius: 6px; font-weight: bold; text-decoration: none; margin: 8px 4px; }
    .btn-linkedin { background: #0a66c2; color: #fff; }
    .btn-pdf { background: #005938; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div id="status" class="status-badge">Verifikation läuft...</div>
    <h2 id="recipient" style="color: #4ade80;">Lade Daten...</h2>
    <p id="course" style="color: #94a3b8; font-size: 1.1rem;"></p>
    <div id="content" style="display:none; margin-top: 25px;">
      <a id="pdfDownloadBtn" class="btn btn-pdf" target="_blank">📥 Offizielles PDF herunterladen</a>
      <br>
      <a id="linkedinBtn" class="btn btn-linkedin" target="_blank">Zu LinkedIn Profil hinzufügen</a>
    </div>
  </div>

  <script>
    async function verify() {
      const id = new URLSearchParams(window.location.search).get('id');
      const statusEl = document.getElementById('status');
      if (!id) {
        statusEl.className = "status-badge invalid";
        statusEl.innerText = "Keine Zertifikats-ID gefunden";
        return;
      }
      try {
        const res = await fetch(`./data/${id}.json?t=${Date.now()}`);
        if (!res.ok) throw new Error();
        const cred = await res.json();

        statusEl.className = "status-badge valid";
        statusEl.innerText = "✓ Offiziell verifiziertes Zertifikat";
        document.getElementById('recipient').innerText = cred.credentialSubject.recipientName;
        document.getElementById('course').innerText = cred.credentialSubject.achievementName;
        document.getElementById('pdfDownloadBtn').href = `./certs/${id}.pdf`;

        const liUrl = `https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME` +
          `&name=${encodeURIComponent(cred.credentialSubject.achievementName)}` +
          `&organizationName=${encodeURIComponent(cred.issuer.name)}` +
          `&certUrl=${encodeURIComponent(window.location.href)}` +
          `&certId=${id}`;
        document.getElementById('linkedinBtn').href = liUrl;
        document.getElementById('content').style.display = "block";
      } catch (e) {
        statusEl.className = "status-badge invalid";
        statusEl.innerText = "✗ Ungültiges oder widerrufenes Zertifikat";
        document.getElementById('recipient').innerText = "Zertifikat nicht auffindbar";
      }
    }
    verify();
  </script>
</body>
</html>
